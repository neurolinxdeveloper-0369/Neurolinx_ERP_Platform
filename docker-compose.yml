version: '3.8'
services:
  db:
    image: postgres:16-alpine
    container_name: tech_source_postgres
    environment:
      POSTGRES_USER: erp_admin
      POSTGRES_PASSWORD: Neurolinx@2026
      POSTGRES_DB: erp_db
    ports:
      - "5435:5432"
    volumes:
      - pgdata_v4:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tech_source_redis
    ports:
      - "6381:6379"
    restart: unless-stopped

  emqx:
    image: emqx:5
    container_name: tech_source_emqx
    ports:
      - "8885:8883"
      - "18085:18083"
      - "1885:1883"
    restart: unless-stopped

  tech_source_api:
    image: ghcr.io/neurolinxdeveloper-0369/erp-api:latest
    container_name: tech_source_api
    depends_on:
      - db
      - redis
    ports:
      - "8088:8080"
    restart: unless-stopped

  tech_source:
    image: ghcr.io/neurolinxdeveloper-0369/erp-frontend:latest
    container_name: tech_source
    ports:
      - "8087:80"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tech_source_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - tech_source_api
      - tech_source
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: tech_source_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait {!}; done;'"
    restart: unless-stopped

volumes:
  pgdata_v4:
  redis_data:
